function hoursFor(p){
  const h=hourDirectory[p.name];if(h)return h;
  if(['Parchi','Passeggiate','Monumenti','Curiosità','Fuori da Edimburgo'].includes(p.category))
    return {short:'Tappa all’aperto',long:'Per le tappe all’aperto controllate eventuali restrizioni e gli accessi sul posto.',url:null,status:'outdoor'};
  return {short:'Orari da verificare',long:'Non abbiamo una fonte affidabile per gli orari attuali di questa attività. Verificateli prima della visita.',url:null,status:'unverified'};
}
function phasesFor(p){
  const n=p.name,c=p.category,phases=[];
  if(breakfastNames.includes(n))phases.push('Colazione');
  if(['Parchi','Passeggiate','Curiosità','Monumenti','Musei','Librerie','Vestiario','Fuori da Edimburgo','Ale’s Path'].includes(c))phases.push('Giretti');
  if(c==='Supermercati'||(['Cibo','Pizza'].includes(c)&&!['Braw Brunch','Castle Café'].includes(n))||n==='The Bay Fish & Chips')phases.push('Cibo');
  if(c==='Pub & Birre')phases.push('Pub');
  if(n==='The Elephant House Café · Victoria Street'&&!phases.includes('Giretti'))phases.push('Giretti');
  return [...new Set(phases)];
}
function dayIcon(p){return p.time?'<span class="time-icons" title="🌅 colazione · ☀️ giorno/pranzo · 🌇 aperitivo · 🌙 sera/cena">'+esc(p.time)+'</span>':'';}
function hourBrief(p){const h=hoursFor(p);return '<span class="hours-tag '+esc(h.status)+'">◷ '+esc(h.short)+'</span>';}
function phaseControls(){return '<div class="phase-tab-group"><span class="phase-label">Momento della giornata</span><div class="toolbar" id="phase-controls">'+['Tutta la giornata',...dayparts].map(o=>'<button data-phase="'+o+'" aria-pressed="'+(phase===o)+'" class="chip '+(phase===o?'active':'')+'" onclick="phaseSelect(\''+o+'\')">'+o+'</button>').join('')+'</div></div>';}
function groupedByPhase(a){
  if(phase!=='Tutta la giornata'){
    const subset=a.filter(p=>phasesFor(p).includes(phase));
    return '<div class="explore-count">'+subset.length+' tappe · '+phase.toLowerCase()+'</div>'+cards(subset);
  }
  return dayparts.map(label=>{
    const subset=a.filter(p=>phasesFor(p).includes(label));
    return subset.length?'<section><h3 class="phase-title">'+label+'<small>'+subset.length+' tappe</small></h3>'+cards(subset)+'</section>':'';
  }).join('')||'<div class="empty">Nessun posto trovato.</div>';
}
function aleResults(){return groupedByPhase(ale);}

function curatedPhoto(p){
 const custom=contributedPhotos[p.name];
 if(custom){const url='./assets/photos/'+custom.file;return {url,source:url,credit:'Immagine fornita per la guida',illustrative:false,curated:true,kind:custom.kind};}
 const entry=curatedPhotos[p.name];if(!entry)return null;
 const name=entry.file.replace(/ /g,'_');
 const source='https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(name);
 const base='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(name);
 const url=base+'?width=960';
 const thumbnailUrl=base+'?width=480';
 return {url,thumbnailUrl,source,credit:entry.author+' · '+entry.license+' · Wikimedia Commons',illustrative:false,curated:true};
}
const photoCache=new Map();
function getPhoto(p){
 if(photoCache.has(p.id))return photoCache.get(p.id);
 // Nessuna ricerca casuale: mostriamo solo foto dei luoghi selezionate e attribuite.
 const selected=curatedPhoto(p);
 photoCache.set(p.id,selected);
 return selected;
}
/* Keep one observer for all cards instead of creating a new one per render. */
let photoObserver=null;
function loadPhoto(el){
  if(el.dataset.loading)return;
  el.dataset.loading='1';
  const p=places[Number(el.dataset.photoId)];
  if(!p)return;
  const photo=getPhoto(p);
  if(!el.isConnected)return;
  if(!photo){
    el.innerHTML=p.name==='Pickleback'
      ?'<span class="photo-unavailable">Nessuna foto della bevanda selezionata</span>'
      :'<span class="photo-unavailable">Foto da scegliere<br><small>Altre immagini su Maps ↗</small></span>';
    return;
  }
  const img=document.createElement('img');
  const inDetail=Boolean(el.closest('.detail'));
  img.loading=inDetail?'eager':'lazy';
  img.decoding='async';
  img.fetchPriority=inDetail?'high':'low';
  img.alt=photo.kind==='logo'?'Logo: '+p.name:photo.illustrative?'Fotografia illustrativa':'Fotografia: '+p.name;
  if(photo.kind==='logo'){img.style.objectFit='contain';img.style.backgroundColor='#fff'}
  img.onerror=()=>{if(!el.isConnected)return;img.remove();el.innerHTML='<span class="photo-unavailable">Foto non disponibile</span>'};
  img.src=(!inDetail&&photo.thumbnailUrl)||photo.url;
  el.replaceChildren(img);
  if(photo.illustrative){
    const tag=document.createElement('span');
    tag.className='photo-illustrative-label';
    tag.textContent='Foto illustrativa';
    el.append(tag);
  }
  if(inDetail){
    const credit=el.closest('.detail').querySelector('#photo-credit');
    if(credit){
      credit.replaceChildren();
      const a=document.createElement('a');
      a.href=photo.source;a.target='_blank';a.rel='noopener';a.textContent=photo.credit;
      credit.append(photo.illustrative?'Foto illustrativa · ':'Foto · ',a);
    }
  }
}
function hydratePhotos(scope=document){
  const nodes=scope.querySelectorAll('[data-photo-id]');
  if(!nodes.length)return;
  if('IntersectionObserver' in window){
    if(!photoObserver)photoObserver=new window.IntersectionObserver(entries=>{
      for(const entry of entries){
        if(entry.isIntersecting){
          photoObserver.unobserve(entry.target);
          loadPhoto(entry.target);
        }
      }
    },{rootMargin:'360px'});
    nodes.forEach(n=>photoObserver.observe(n));
  }else nodes.forEach(loadPhoto);
}
function unobservePhotos(scope){
  if(!photoObserver||!scope)return;
  scope.querySelectorAll('[data-photo-id]').forEach(n=>photoObserver.unobserve(n));
}

async function copyLoyalty(type){
  const value=loyaltyNumbers[type];
  if(!value)return;
  let success=false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(value);
      success=true;
    }
  }catch(e){}
  if(!success){
    const temp=document.createElement('textarea');
    temp.value=value;
    temp.setAttribute('readonly','');
    temp.style.cssText='position:fixed;opacity:0;left:-9999px;top:0';
    document.body.append(temp);
    temp.focus();temp.select();temp.setSelectionRange(0,value.length);
    try{success=document.execCommand('copy')}catch(e){}
    temp.remove();
  }
  const status=document.getElementById('copy-status-'+type);
  const button=document.getElementById('copy-btn-'+type);
  if(status)status.textContent=success?'Codice copiato: ora incollatelo su Klarna.':'Impossibile copiare automaticamente. Selezionate e copiate il numero qui sopra.';
  if(success&&button)button.textContent='✓ Copiato!';
}
function loyaltyPanel(type,title){
  const number=loyaltyNumbers[type];

  return `<section class="loyalty-simple" aria-label="${esc(title)}">
    <h3>${esc(title)}</h3>
    <span class="loyalty-plain-number" role="text" aria-label="Numero della tessera">${number}</span>

  </section>`;
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function star(p){return `<button class="star ${saved.includes(p.id)?'on':''}" data-star-id="${p.id}" aria-pressed="${saved.includes(p.id)}" aria-label="${saved.includes(p.id)?'Rimuovi':'Aggiungi'} ${esc(p.name)} dai preferiti" onclick="toggle(${p.id})">${saved.includes(p.id)?'★':'☆'}</button>`}function card(p){return `<article class="card"><button class="thumb photo-thumb" data-photo-id="${p.id}" onclick="openPlace(${p.id})" aria-label="Apri ${esc(p.name)}"><span class="photo-placeholder"></span></button><button class="cardmain" onclick="openPlace(${p.id})"><strong>${esc(p.name)}</strong><small class="card-category">${p.type==='mild'?'Mild':p.type==='spicy'?'Spicy':esc(p.category)} · ${esc(p.category)} ${dayIcon(p)}</small><small class="card-timing">${hourBrief(p)}</small></button>${star(p)}</article>`}
function cards(a){return a.length?`<div class="cards">${a.map(card).join('')}</div>`:'<div class="empty">Nessun posto trovato.</div>'}
function mix(a){let m=a.filter(p=>p.type==='mild').length,s=a.filter(p=>p.type==='spicy').length,t=m+s,mp=t?Math.round(m/t*100):0;return `<div class="mix"><div class="row"><b>YOUR EDINBURGH MIX</b><span>🌿🌶️</span></div><div class="stats"><div class="stat">🌿 Mildness<strong>${mp}%</strong></div><div class="stat sp">🌶️ Spiciness<strong>${t?100-mp:0}%</strong></div></div><div class="bar"><div style="width:${mp}%"></div></div><p style="font-size:12px;color:#cbd7ce">${t} tappe Mild/Spicy nel mix</p></div>`}function nav(){document.getElementById('nav').innerHTML=[['home','⌂','Home'],['explore','⌕','Esplora'],['favorites','☆','Preferiti'],['ale','⌖','Ale’s Path']].map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><b>${ico}</b>${label}</button>`).join('')}
let phase='Tutta la giornata';
function go(p){page=p;filter='Tutti';phase='Tutta la giornata';query='';render();window.scrollTo(0,0)}
function section(p,title){page=p;filter=title;phase='Tutta la giornata';query='';render();window.scrollTo(0,0)}
function phaseSelect(next){phase=next;updateResults();renderPhaseControls()}
function filterSelect(next){filter=next;updateResults();renderFilterControls()}
function renderPhaseControls(){document.querySelectorAll('[data-phase]').forEach(el=>{const on=el.dataset.phase===phase;el.classList.toggle('active',on);el.setAttribute('aria-pressed',String(on))})}
function renderFilterControls(){document.querySelectorAll('[data-filter]').forEach(el=>{const on=el.dataset.filter===filter;el.classList.toggle('active',on);el.setAttribute('aria-pressed',String(on))})}
function filteredPlaces(){return places.filter(p=>p.type!=='personal'&&(filter==='Tutti'||(filter==='Mild'&&p.type==='mild')||(filter==='Spicy'&&p.type==='spicy')||p.category===filter||(filter==='Cibo'&&p.category==='Supermercati'))).filter(p=>(p.name+' '+p.category+' '+p.description).toLowerCase().includes(query.toLowerCase()))}
function exploreResults(){return groupedByPhase(filteredPlaces());}
let ideaIds=[1,6,12,13],pendingIdeaIds=null,ideasFrame=null;
function randomizeIdeas(){
  const excluded=new Set([...ideaIds,...(pendingIdeaIds||[])]);
  const candidates=places.filter(p=>p.type!=='personal'&&!excluded.has(p.id));
  // Choose just four: no need to shuffle the whole dataset on every tap.
  for(let i=0;i<4;i++){
    const j=i+Math.floor(Math.random()*(candidates.length-i));
    [candidates[i],candidates[j]]=[candidates[j],candidates[i]];
  }
  pendingIdeaIds=candidates.slice(0,4).map(p=>p.id);
  // Coalesce rapid taps: only the latest selection gets rendered per frame.
  if(ideasFrame!==null)return;
  ideasFrame=window.requestAnimationFrame(()=>{
    ideasFrame=null;
    if(page!=='home'){pendingIdeaIds=null;return}
    const next=pendingIdeaIds;
    pendingIdeaIds=null;
    if(!next)return;
    ideaIds=next;
    const holder=document.getElementById('home-ideas');
    if(holder){
      unobservePhotos(holder);
      holder.innerHTML=cards(ideaIds.map(id=>places[id]));
      hydratePhotos(holder);
    }
  });
}


function render(){
 unobservePhotos(app);
 nav();
 if(page==='home'){
  app.innerHTML=`<section class="arrival-tip" aria-label="Come arrivare dall’aeroporto"><strong>🚌 Appena atterrate</strong><p>Probabilmente raggiungerete il centro con l’<b>Airlink 100</b> (l’autobus). C’è anche il tram, ma io non l’ho mai preso. Se prendete l’Airlink, chiedete di comprare il biglietto andata e ritorno — <b>Airport Open Return</b>: il ritorno non ha una data fissa e risparmiate qualche pound rispetto a due biglietti singoli.</p><a href="https://www.lothianbuses.com/our-services/airport-buses/" target="_blank" rel="noopener noreferrer">Comunicazioni ufficiali ↗</a></section><div class="hero-grid"><button class="hero" onclick="section('explore','Mild')">🌿<strong>Mild</strong><span>Classici, passeggiate e posti tranquilli. ↗</span></button><button class="hero spicy" onclick="section('explore','Spicy')">🌶️<strong>Spicy</strong><span>Posti strani, cibo e qualche deviazione. ↗</span></button></div><button class="strip" onclick="go('ale')"><strong>📍 Ale’s Path →</strong><small>Quello che farei io, se fossi lì.</small></button><h2 class="section-title">Le altre cose</h2><div class="extras"><button class="extra" onclick="section('explore','Pizza')">🍕 Pizza, anche se weird<small>Due opzioni, zero giudizi</small></button><button class="extra" onclick="section('explore','Fuori da Edimburgo')">🏔️ Fuori da Edimburgo<small>Gite e idee</small></button><button class="extra" onclick="page='loyalty';render()">💳 Loyalty Cards<small>Lidl Plus e Tesco Clubcard</small></button><button class="extra" onclick="page='notes';render()">⚠️ Survival Notes<small>Consigli prima di partire</small></button></div><div class="ideas-heading"><h2 class="section-title">Qualche idea</h2><button type="button" class="shuffle-ideas" onclick="randomizeIdeas()" aria-label="Randomizza scelte">↻ Randomizza scelte</button></div><div id="home-ideas" aria-live="polite">${cards(ideaIds.map(id=>places[id]))}</div>`;
 }else if(page==='explore'){
  const options=['Tutti','Mild','Spicy','Cibo','Pub & Birre','Passeggiate','Musei','Supermercati','Librerie','Vestiario','Caffè','Pizza','Fuori da Edimburgo'];
  app.innerHTML=`<h2 class="section-title">Esplora Edimburgo</h2><p class="phase-hint">Scegliete quando uscire, poi filtrate per genere di posto. 🌅 colazione · ☀️ giorno/pranzo · 🌇 aperitivo · 🌙 sera/cena. Gli orari sotto ogni card hanno una fonte o sono segnalati come da verificare.</p><input class="search" placeholder="Cerca un posto, una pizza, un pub…" aria-label="Cerca" value="${esc(query)}" oninput="query=this.value;updateResults()">${phaseControls()}<div class="phase-tab-group"><span class="phase-label">Cosa cercate</span><div class="toolbar" id="filter-controls">${options.map(o=>`<button data-filter="${esc(o)}" aria-pressed="${filter===o}" class="chip ${filter===o?'active':''}" onclick="filterSelect('${esc(o)}')">${esc(o)}</button>`).join('')}</div></div><div id="results">${exploreResults()}</div>`;
 }else if(page==='favorites'){
  const a=places.filter(p=>saved.includes(p.id));app.innerHTML=`<h2 class="section-title">⭐ Preferiti</h2><p>Il vostro giro, deciso da voi.</p>${mix(a)}${cards(a)}`;
 }else if(page==='ale'){
  app.innerHTML=`<h2 class="section-title">📍 Ale’s Path</h2><p>Quello che farei io, se fossi lì. Le tappe sono raggruppate per momento della giornata, non è un itinerario obbligatorio. 🌅 mattina · ☀️ giorno/pranzo · 🌇 aperitivo · 🌙 sera/cena.</p>${mix(ale)}${phaseControls()}<div id="results">${aleResults()}</div>`;
 }else if(page==='loyalty'){
  app.innerHTML=`<h2 class="section-title">Loyalty Cards</h2><p>Copiate il numero della tessera e inseritelo nell'app Klarna.</p>${loyaltyPanel('lidl','Lidl Plus')}${loyaltyPanel('tesco','Tesco Clubcard')}<p class="photo-credit">I numeri delle tessere sono pubblicamente visibili su questo sito.</p>`;
 }else if(page==='notes'){
  app.innerHTML=`<h2 class="section-title">⚠️ Survival Notes</h2><div class="notice">🌬️ <b>Vento e pioggia.</b> Ad Arthur’s Seat servono scarpe decenti; con terreno bagnato fate attenzione.</div><div class="notice">🥪 <b>Meal Deal.</b> Da Tesco e Sainsbury’s scegliete un main, uno snack e una bevanda tra i prodotti inclusi nella promozione.</div><div class="notice">🐕 <b>Greyfriars Bobby.</b> Il naso lucido non è un invito a strofinarlo.</div><div class="notice">🥔 <b>Makars.</b> Provate a chiedere direttamente un tavolo: potrebbe esserci da aspettare.</div><div class="notice">🗼 <b>Scott Monument.</b> I gradini per salire sono stretti.</div>`;
 }else{page='home';render();return}
 hydratePhotos(app);
}
function updateResults(){const container=document.getElementById('results');if(!container)return;unobservePhotos(container);container.innerHTML=page==='ale'?aleResults():exploreResults();hydratePhotos(container)}
/* A favourite click must never redraw the page (and hence reload its photos). */
function toggle(id){
 const wasSaved=saved.includes(id);
 saved=wasSaved?saved.filter(x=>x!==id):[...saved,id];
 try{localStorage.setItem('edinburgh-stars',JSON.stringify(saved))}catch(e){}
 document.querySelectorAll('[data-star-id]').forEach(button=>{
   const p=places[Number(button.dataset.starId)];
   if(!p)return;
   const selected=saved.includes(p.id);
   button.classList.toggle('on',selected);
   button.textContent=selected?'★':'☆';
   button.setAttribute('aria-pressed',String(selected));
   button.setAttribute('aria-label',(selected?'Rimuovi ':'Aggiungi ')+p.name+' dai preferiti');
 });
 if(page==='favorites'&&wasSaved){
   app.querySelectorAll('.cards [data-star-id="'+id+'"]').forEach(button=>{
     const cardElement=button.closest('.card');
     if(cardElement){unobservePhotos(cardElement);cardElement.remove()}
   });
   const updated=places.filter(p=>saved.includes(p.id));
   const summary=app.querySelector('.mix');
   if(summary)summary.outerHTML=mix(updated);
   const list=app.querySelector('.cards');
   if(list&&!list.children.length)list.outerHTML='<div class="empty">Nessun posto trovato.</div>';
 }
}
function openPlace(id){
 const p=places[id];
 unobservePhotos(detail);
 detail.innerHTML=`<div class="detailhero photo-thumb" data-photo-id="${p.id}"><span class="photo-placeholder"></span></div><div class="detailbody"><button class="back" onclick="closePlace()">← Indietro</button><div class="row"><small>${p.type==='mild'?'MILD':p.type==='spicy'?'SPICY':esc(p.category)} · ${phasesFor(p).join(' / ')} ${dayIcon(p)}</small>${star(p)}</div><h1 style="color:#293b30;font-size:33px">${esc(p.name)}</h1><p style="font-size:17px;line-height:1.55">${esc(p.description)}</p>${p.name==='The Original Mosque Kitchen & Café'?`<div class="mosque-directions"><strong>📍 50 Potterrow, Edinburgh EH8 9BT</strong><p>Per arrivarci, passate tra la moschea e il locale affacciato sulla strada, tenendo la moschea sulla vostra sinistra. Scendete le scale e girate a destra: troverete la vera Kitchen nel cortile sul retro.</p><small>Attenzione: è diversa dal ristorante di 31–33 Nicolson Square.</small></div>`:""}<div class="hours-detail"><strong>◷ ${esc(hoursFor(p).short)}</strong><p>${esc(hoursFor(p).long)}</p>${hoursFor(p).url?`<a target="_blank" rel="noopener noreferrer" href="${esc(hoursFor(p).url)}">Fonte e aggiornamenti ↗</a>`:"<small>Orari non verificati: controllate prima della visita.</small>"}<small>Controllo: 15 ottobre 2026 · orari soggetti a variazioni</small></div>${p.warning?`<div class="notice">⚠️ ${esc(p.warning)}</div>`:''}${p.name==='Pickleback'?'':`<a class="maps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name==='The Original Mosque Kitchen & Café'?'The Original Mosque Kitchen and Cafe 50 Potterrow Edinburgh EH8 9BT':p.name==='The Elephant House Café · Victoria Street'?'30 Victoria Street Edinburgh Scotland':p.name==='Armstrongs & Son Vintage · Grassmarket'?'83 Grassmarket Edinburgh Scotland':p.name==='Armstrongs & Son Vintage · Cockburn Street'?'29 Cockburn Street Edinburgh Scotland':p.name+' Edinburgh Scotland')}">↗ Apri su Google Maps (foto e orari aggiornati)</a>`}<p id="photo-credit" class="photo-credit">Immagine da Wikimedia Commons, dove disponibile.</p></div>`;
 detail.classList.remove('hidden');document.body.style.overflow='hidden';hydratePhotos(detail);
}
function closePlace(){if(detail.classList.contains('hidden'))return;detail.classList.add('hidden');document.body.style.overflow='';unobservePhotos(detail);detail.replaceChildren()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlace()});render();
</script></body></html>
