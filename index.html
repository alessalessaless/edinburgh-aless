function phasesFor(p){

  if(['Parchi','Passeggiate','Curiosità','Monumenti','Musei','Librerie','Supermercati','Fuori da Edimburgo','Ale’s Path'].includes(c))phases.push('Giretti');
  if(['Cibo','Pizza'].includes(c)&&!['Braw Brunch','Castle Café'].includes(n) || n==='The Bay Fish & Chips')phases.push('Cibo');
  if(c==='Pub & Birre')phases.push('Birrette');
  if(postNames.includes(n))phases.push('Post cena');

function groupedByPhase(a){
  if(phase!=='Tutta la giornata'){

function curatedPhoto(p){
 const entry=curatedPhotos[p.name];if(!entry)return null;
 const name=entry.file.replace(/ /g,'_');
 const source='https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(name);
 const url='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(name)+'?width=960';
 return {url,source,credit:entry.author+' · '+entry.license+' · Wikimedia Commons',illustrative:false,curated:true};
}
const photoCache=new Map(),photoPromises=new Map();
function isPhoto(info){return info&&/^https:\/\/upload\.wikimedia\.org\//.test(info.url)}
async function wikiPhoto(p){
  const title=wikiTitles[p.name];if(!title)return null;
  const u=new URL('https://en.wikipedia.org/w/api.php');
  Object.entries({action:'query',format:'json',origin:'*',prop:'pageimages',titles:title,pithumbsize:'960',pilicense:'free',redirects:'1'}).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u.toString());if(!r.ok)throw Error('Wikipedia');
  const j=await r.json(),pg=Object.values(j.query?.pages||{}).find(x=>x.thumbnail?.source&&x.pageimage);
  if(!pg)return null;
  return {url:pg.thumbnail.source,source:'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(pg.pageimage.replace(/ /g,'_')),credit:'Wikimedia Commons (vedi autore e licenza)',illustrative:false};
}
async function commonsPhoto(term,illustrative,expectedName){
  const u=new URL('https://commons.wikimedia.org/w/api.php');
  Object.entries({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:term+' filetype:bitmap',gsrnamespace:'6',gsrlimit:'10',prop:'imageinfo',iiprop:'url|mime|size|extmetadata',iiurlwidth:'960'}).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u.toString());if(!r.ok)throw Error('Commons');
  const j=await r.json();
  const pages=Object.values(j.query?.pages||{}).sort((a,b)=>(a.index||99)-(b.index||99));
  const candidates=pages.filter(pg=>{
    const v=pg.imageinfo?.[0],name=pg.title||'';
    return v&&v.width>=500&&v.height>=250&&/image\/(jpeg|png|webp)/.test(v.mime||'')&&!/logo|map|diagram|poster|vector|advert|screenshot|illustration|cartoon|icon|flag|trademark/i.test(name)
  });
  const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ');
  const identifyingWords=(expectedName||'').split(/[^\p{L}\p{N}]+/u).map(norm).filter(w=>w.length>=4&&!['edinburgh','scotland','house','street','castle','museum','coffee','beach','proper'].includes(w));
  const pg=expectedName?candidates.find(x=>identifyingWords.length>0&&identifyingWords.some(w=>norm(x.title).includes(w))):candidates[0];if(!pg)return null;
  const v=pg.imageinfo[0];
  const author=(v.extmetadata?.Artist?.value||'').replace(/<[^>]+>/g,' ').replace(/&[^;]+;/g,' ').replace(/\s+/g,' ').trim().slice(0,95);
  const licence=(v.extmetadata?.LicenseShortName?.value||'licenza nella scheda Commons').replace(/<[^>]+>/g,'').slice(0,35);
  return {url:v.thumburl||v.url,source:v.descriptionurl||('https://commons.wikimedia.org/wiki/'+encodeURIComponent(pg.title.replace(/ /g,'_'))),credit:(author?author+' · ':'')+licence+' · Wikimedia Commons',illustrative};
}
async function getPhoto(p){
 if(photoCache.has(p.id))return photoCache.get(p.id);
 // Nessuna ricerca casuale: mostriamo solo foto dei luoghi selezionate e attribuite.
 const selected=curatedPhoto(p);
 photoCache.set(p.id,selected);
 return selected;
}
function hydratePhotos(scope=document){
  const nodes=Array.from(scope.querySelectorAll('[data-photo-id]'));
  if(!nodes.length)return;
  const load=el=>{
    if(el.dataset.loading)return;
    el.dataset.loading='1';
    const p=places[Number(el.dataset.photoId)];
    if(!p)return;
    getPhoto(p).then(photo=>{
      if(!el.isConnected)return;
      if(!photo){el.innerHTML=p.name==='Pickleback'?'<span class="photo-unavailable">Nessuna foto della bevanda selezionata</span>':'<span class="photo-unavailable">Foto da scegliere<br><small>Altre immagini su Maps ↗</small></span>';return;}
      const img=document.createElement('img');img.loading='lazy';img.decoding='async';img.alt=photo.illustrative?'Fotografia illustrativa':'Fotografia: '+p.name;
      img.onerror=()=>{img.remove();el.innerHTML='<span class="photo-unavailable">Foto non disponibile</span>'};
      img.src=photo.url;el.replaceChildren(img);if(photo.illustrative){const tag=document.createElement('span');tag.className='photo-illustrative-label';tag.textContent='Foto illustrativa';el.append(tag)}
      if(el.closest('.detail')){
        const credit=el.closest('.detail').querySelector('#photo-credit');
        if(credit){credit.replaceChildren();const a=document.createElement('a');a.href=photo.source;a.target='_blank';a.rel='noopener';a.textContent=photo.credit;credit.append(photo.illustrative?'Foto illustrativa · ':'Foto · ',a)}
      }
    });
  };
  if('IntersectionObserver' in window){
    const obs=new IntersectionObserver((entries)=>entries.forEach(e=>{if(e.isIntersecting){obs.unobserve(e.target);load(e.target)}}),{rootMargin:'360px'});
    nodes.forEach(n=>obs.observe(n));
  }else nodes.forEach(load);
}

function loadLibrary(name){

  return scriptPromises[name]=new Promise((resolve,reject)=>{
    const script=document.createElement('script');script.src=libraryScripts[name];script.onload=resolve;script.onerror=()=>reject(Error('Libreria non disponibile'));document.head.append(script);
  });
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function star(p){return `<button class="star ${saved.includes(p.id)?'on':''}" aria-label="${saved.includes(p.id)?'Rimuovi':'Aggiungi'} ${esc(p.name)} dai preferiti" onclick="toggle(${p.id})">${saved.includes(p.id)?'★':'☆'}</button>`}function card(p){return `<article class="card"><button class="thumb photo-thumb" data-photo-id="${p.id}" onclick="openPlace(${p.id})" aria-label="Apri ${esc(p.name)}"><span class="photo-placeholder"></span></button><button class="cardmain" onclick="openPlace(${p.id})"><strong>${esc(p.name)}</strong><small class="card-category">${p.type==='mild'?'Mild':p.type==='spicy'?'Spicy':esc(p.category)} · ${esc(p.category)} ${dayIcon(p)}</small><small class="card-timing">${hourBrief(p)}</small></button>${star(p)}</article>`}
function cards(a){return a.length?`<div class="cards">${a.map(card).join('')}</div>`:'<div class="empty">Nessun posto trovato.</div>'}
function mix(a){let m=a.filter(p=>p.type==='mild').length,s=a.filter(p=>p.type==='spicy').length,t=m+s,mp=t?Math.round(m/t*100):0;return `<div class="mix"><div class="row"><b>YOUR EDINBURGH MIX</b><span>🌿🌶️</span></div><div class="stats"><div class="stat">🌿 Mildness<strong>${mp}%</strong></div><div class="stat sp">🌶️ Spiciness<strong>${t?100-mp:0}%</strong></div></div><div class="bar"><div style="width:${mp}%"></div></div><p style="font-size:12px;color:#cbd7ce">${t} tappe Mild/Spicy nel mix</p></div>`}function nav(){document.getElementById('nav').innerHTML=[['home','⌂','Home'],['explore','⌕','Esplora'],['favorites','☆','Preferiti'],['ale','⌖','Ale’s Path']].map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><b>${ico}</b>${label}</button>`).join('')}
let phase='Tutta la giornata';
function go(p){page=p;filter='Tutti';phase='Tutta la giornata';query='';render();window.scrollTo(0,0)}
function section(p,title){page=p;filter=title;phase='Tutta la giornata';query='';render();window.scrollTo(0,0)}
function phaseSelect(next){phase=next;updateResults();renderPhaseControls()}
function filterSelect(next){filter=next;updateResults();renderFilterControls()}
function renderPhaseControls(){document.querySelectorAll('[data-phase]').forEach(el=>{const on=el.dataset.phase===phase;el.classList.toggle('active',on);el.setAttribute('aria-pressed',String(on))})}
function renderFilterControls(){document.querySelectorAll('[data-filter]').forEach(el=>{const on=el.dataset.filter===filter;el.classList.toggle('active',on);el.setAttribute('aria-pressed',String(on))})}
function filteredPlaces(){return places.filter(p=>p.type!=='personal'&&(filter==='Tutti'||(filter==='Mild'&&p.type==='mild')||(filter==='Spicy'&&p.type==='spicy')||p.category===filter)).filter(p=>(p.name+' '+p.category+' '+p.description).toLowerCase().includes(query.toLowerCase()))}
function exploreResults(){return groupedByPhase(filteredPlaces());}

function render(){
 nav();
 if(page==='home'){
  app.innerHTML=`<div class="hero-grid"><button class="hero" onclick="section('explore','Mild')">🌿<strong>Mild</strong><span>Classici, passeggiate e posti tranquilli. ↗</span></button><button class="hero spicy" onclick="section('explore','Spicy')">🌶️<strong>Spicy</strong><span>Posti strani, cibo e qualche deviazione. ↗</span></button></div><button class="strip" onclick="go('ale')"><strong>📍 Ale’s Path →</strong><small>Quello che farei io, se fossi lì.</small></button><h2 class="section-title">Le altre cose</h2><div class="extras"><button class="extra" onclick="section('explore','Pizza')">🍕 Pizza, anche se weird<small>Due opzioni, zero giudizi</small></button><button class="extra" onclick="section('explore','Fuori da Edimburgo')">🏔️ Fuori da Edimburgo<small>Gite e idee</small></button><button class="extra" onclick="page='loyalty';render()">💳 Loyalty Cards<small>Lidl Plus e Tesco Clubcard</small></button><button class="extra" onclick="page='notes';render()">⚠️ Survival Notes<small>Consigli prima di partire</small></button></div><h2 class="section-title">Qualche idea</h2>${cards([places[1],places[6],places[12],places[13]])}`;
 }else if(page==='explore'){
  const options=['Tutti','Mild','Spicy','Cibo','Pub & Birre','Passeggiate','Musei','Supermercati','Librerie','Caffè','Pizza','Fuori da Edimburgo'];
  app.innerHTML=`<h2 class="section-title">Esplora Edimburgo</h2><p class="phase-hint">Scegliete quando uscire, poi filtrate per genere di posto. 🌅 colazione · ☀️ giorno/pranzo · 🌇 aperitivo · 🌙 sera/cena. Gli orari sotto ogni card hanno una fonte o sono segnalati come da verificare.</p><input class="search" placeholder="Cerca un posto, una pizza, un pub…" aria-label="Cerca" value="${esc(query)}" oninput="query=this.value;updateResults()">${phaseControls()}<div class="phase-tab-group"><span class="phase-label">Cosa cercate</span><div class="toolbar" id="filter-controls">${options.map(o=>`<button data-filter="${esc(o)}" aria-pressed="${filter===o}" class="chip ${filter===o?'active':''}" onclick="filterSelect('${esc(o)}')">${esc(o)}</button>`).join('')}</div></div><div id="results">${exploreResults()}</div>`;
 }else if(page==='favorites'){
  const a=places.filter(p=>saved.includes(p.id));app.innerHTML=`<h2 class="section-title">⭐ Preferiti</h2><p>Il vostro giro, deciso da voi.</p>${mix(a)}${cards(a)}`;
 }else if(page==='ale'){
  app.innerHTML=`<h2 class="section-title">📍 Ale’s Path</h2><p>Quello che farei io, se fossi lì. Le tappe sono raggruppate per momento della giornata, non è un itinerario obbligatorio. 🌅 mattina · ☀️ giorno/pranzo · 🌇 aperitivo · 🌙 sera/cena.</p>${mix(ale)}${phaseControls()}<div id="results">${aleResults()}</div>`;
 }else if(page==='loyalty'){
  app.innerHTML=`<h2 class="section-title">Loyalty Cards</h2><p>Aprite la tessera che vi serve e mostrate il codice a schermo intero alla cassa.</p><button class="loyalty-tile" onclick="loyaltyCard('lidl')"><span><strong>Lidl Plus</strong><small>QR code · 774 400 092 343 283 64</small></span><span aria-hidden="true">↗</span></button><button class="loyalty-tile" onclick="loyaltyCard('tesco')"><span><strong>Tesco Clubcard</strong><small>Codice a barre · 634004 0276 1162 4888</small></span><span aria-hidden="true">↗</span></button><p class="photo-credit">I codici tessera sono visibili pubblicamente su questo sito.</p>`;
 }else if(page==='notes'){
  app.innerHTML=`<h2 class="section-title">⚠️ Survival Notes</h2><div class="notice">🌬️ <b>Vento e pioggia.</b> Ad Arthur’s Seat servono scarpe decenti; con terreno bagnato fate attenzione.</div><div class="notice">🥪 <b>Meal Deal.</b> Da Tesco e Sainsbury’s scegliete un main, uno snack e una bevanda tra i prodotti inclusi nella promozione.</div><div class="notice">🐕 <b>Greyfriars Bobby.</b> Il naso lucido non è un invito a strofinarlo.</div><div class="notice">🥔 <b>Makars.</b> Provate a chiedere direttamente un tavolo: potrebbe esserci da aspettare.</div><div class="notice">🗼 <b>Scott Monument.</b> I gradini per salire sono stretti.</div>`;
 }else{page='home';render();return}
 hydratePhotos(app);
}
function updateResults(){const container=document.getElementById('results');if(!container)return;container.innerHTML=page==='ale'?aleResults():exploreResults();hydratePhotos(container)}
function toggle(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('edinburgh-stars',JSON.stringify(saved));render()}
function openPlace(id){
 const p=places[id];
 detail.innerHTML=`<div class="detailhero photo-thumb" data-photo-id="${p.id}"><span class="photo-placeholder"></span></div><div class="detailbody"><button class="back" onclick="closePlace()">← Indietro</button><div class="row"><small>${p.type==='mild'?'MILD':p.type==='spicy'?'SPICY':esc(p.category)} · ${phasesFor(p).join(' / ')} ${dayIcon(p)}</small>${star(p)}</div><h1 style="color:#293b30;font-size:33px">${esc(p.name)}</h1><p style="font-size:17px;line-height:1.55">${esc(p.description)}</p><div class="hours-detail"><strong>◷ ${esc(hoursFor(p).short)}</strong><p>${esc(hoursFor(p).long)}</p>${hoursFor(p).url?`<a target="_blank" rel="noopener noreferrer" href="${esc(hoursFor(p).url)}">Fonte e aggiornamenti ↗</a>`:"<small>Orari non verificati: controllate prima della visita.</small>"}<small>Controllo: 15 ottobre 2026 · orari soggetti a variazioni</small></div>${p.warning?`<div class="notice">⚠️ ${esc(p.warning)}</div>`:''}${p.name==='Pickleback'?'':`<a class="maps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' Edinburgh Scotland')}">↗ Apri su Google Maps (foto e orari aggiornati)</a>`}<p id="photo-credit" class="photo-credit">Immagine da Wikimedia Commons, dove disponibile.</p></div>`;
 detail.classList.remove('hidden');document.body.style.overflow='hidden';hydratePhotos(detail);
}
function closePlace(){detail.classList.add('hidden');document.body.style.overflow='';render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlace()});render();
</script></body></html>
