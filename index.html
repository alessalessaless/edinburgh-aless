<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#25362e"><title>Edinburgh Aless</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#293b30;background:#f7f3ea}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{background:#25362e;color:#faf5e9;padding:24px 20px 22px;border-radius:0 0 25px 25px}header small{letter-spacing:.16em;color:#b5c7b8;font-size:10px}h1{font-family:Georgia,serif;font-size:37px;line-height:1.05;margin:9px 0}header p{color:#cbd6cb;margin:0}.shell{max-width:650px;margin:auto;padding:18px 16px 108px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-title{font-family:Georgia,serif;font-size:24px;margin:22px 0 12px}.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hero{border:0;border-radius:18px;padding:20px 14px;min-height:165px;text-align:left;color:#263b2c;background:#dce8d4}.hero.spicy{background:#f2d1ba;color:#653d2e}.hero strong{display:block;font-family:Georgia,serif;font-size:26px;margin:12px 0}.hero span{font-size:12px;line-height:1.4}.strip{background:#e8e2d6;border:0;border-radius:17px;padding:17px;text-align:left;width:100%;margin:13px 0 0}.strip strong{display:block;font-size:17px}.strip small{color:#617165}.extras{display:grid;grid-template-columns:1fr 1fr;gap:9px}.extra{background:white;border:1px solid #e6e1d7;border-radius:14px;padding:14px;text-align:left;min-height:83px;font-weight:650}.extra small{display:block;font-weight:400;color:#69796c;margin-top:5px}.cards{display:grid;gap:10px}.card{background:white;border:1px solid #e9e5dd;border-radius:16px;display:flex;align-items:center;gap:12px;padding:10px}.thumb{height:78px;width:85px;flex:none;border-radius:11px;background:linear-gradient(135deg,#c5d6c3,#e8d8c5);display:grid;place-items:center;font-size:31px}.cardmain{flex:1;min-width:0;border:0;background:none;text-align:left;padding:3px 0;color:inherit}.cardmain strong{display:block;font-size:15px}.cardmain small{display:block;color:#718074;margin-top:5px}.star{border:0;background:#f5f2eb;border-radius:50%;font-size:23px;width:42px;height:42px;color:#8a948a}.star.on{color:#db9d37;background:#fff4dc}.toolbar{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}.chip{white-space:nowrap;border:1px solid #d9dcd4;background:white;border-radius:100px;padding:9px 13px;font-size:13px}.chip.active{background:#293d31;color:white}.search{width:100%;padding:14px;border:1px solid #d8ded5;border-radius:14px;background:white;margin:4px 0 8px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8;border-top:1px solid #e6e2d8;display:flex;justify-content:space-around;padding:9px 5px calc(10px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;color:#7b877d;font-size:11px;min-width:65px}.nav button b{display:block;font-size:22px;margin-bottom:3px}.nav button.active{color:#294734;font-weight:700}.mix{background:#293d31;color:white;border-radius:19px;padding:20px;margin:14px 0}.mix .stats{display:flex;gap:10px;margin:13px 0}.stat{flex:1;border-radius:12px;background:#3c5642;padding:13px}.stat.sp{background:#714d3d}.stat strong{font-size:29px;display:block}.bar{height:13px;background:#ba8065;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#a6c7a0}.note{font-size:12px;color:#7c867c}.empty{padding:30px;text-align:center;color:#798579;background:white;border-radius:15px}.detail{position:fixed;inset:0;background:#f7f3ea;z-index:30;overflow:auto;padding-bottom:30px}.detailhero{height:210px;background:linear-gradient(135deg,#d7e2d2,#f0d7bf);display:grid;place-items:center;font-size:85px}.detailbody{padding:23px;max-width:650px;margin:auto}.back{border:0;background:#fff;padding:11px 15px;border-radius:30px;margin-bottom:15px}.maps{display:block;background:#293d31;color:white;text-align:center;border-radius:40px;padding:15px;text-decoration:none;margin-top:18px}.notice{background:#ebe5d8;padding:13px;border-radius:12px;margin-top:12px}.loyal{background:white;border-radius:15px;padding:15px;margin:12px 0}.loyal img{display:block;width:100%;max-height:260px;object-fit:contain;margin:10px 0;cursor:zoom-in}.loyal code{overflow-wrap:anywhere}.photo-disclaimer{font-size:12px;color:#6e7b71;margin:8px 0}.hidden{display:none!important}button:focus-visible,a:focus-visible{outline:3px solid #a46b40;outline-offset:3px}
</style></head><body><header><small>YOUR VERY PERSONAL GUIDE TO</small><h1>Edinburgh Aless</h1><p>Mild or Spicy? 🌿🌶️</p></header><main id="app" class="shell"></main><nav class="nav" id="nav"></nav><div id="detail" class="detail hidden"></div><script>
const raw=[
['The Meadows','mild','🌳','🌅☀️','Parchi','Un parco enorme dove fermarvi a passeggiare o stare sull’erba.'],['Arthur’s Seat','spicy','⛰️','🌅☀️','Passeggiate','La vista ripaga la salita. Portate scarpe decenti e non sottovalutate il vento.','Se piove o tira molto vento, valutate bene la salita.'],['Rockstar North','spicy','🎮','☀️','Curiosità','Gli uffici dello studio di GTA. Guardateli da fuori; anche la zona merita un giro.'],['Mosque Kitchen','spicy','🍛','☀️🌙','Cibo','Cucina indiana, porzioni abbondanti e prezzi accessibili.'],['Pickleback','spicy','🥃','🌇🌙','Pub & Birre','Se volete provarlo, è uno shot di whisky seguito da uno shot di liquido dei cetriolini sottaceto.'],['The Last Drop','spicy','🍺','🌇🌙','Pub & Birre','Un pub a Grassmarket. Il nome richiama le esecuzioni che avvenivano nella piazza.'],['National Museum of Scotland','mild','🦕','🌅☀️','Musei','Museo enorme, gratuito e perfetto se piove. C’è anche Dolly, la pecora clonata.'],['Scott Monument','mild','🗼','🌅☀️','Monumenti','Una torre gotica in centro. Se salite, preparatevi a parecchi gradini stretti.'],['Bertie’s Proper Fish & Chips','mild','🐟','☀️🌙','Cibo','Se volete provare un fish & chips bello sostanzioso, fermatevi qui.'],['Tesco','spicy','🛒','🌅☀️🌙','Supermercati','Per una pausa economica, cercate il Meal Deal: main, snack e drink tra quelli inclusi.'],['Scottish Parliament','mild','🏛️','🌅☀️','Monumenti','Il Parlamento scozzese, ai piedi della Royal Mile.'],['Pepe’s Piri Piri','spicy','🌶️','☀️🌙','Cibo','Pollo speziato e fast food senza troppe pretese. C’è anche la salsa finale super piccante, se volete rischiare.'],['Calton Hill','mild','🌄','☀️🌇','Passeggiate','Una delle viste migliori della città, con molta meno fatica di Arthur’s Seat.'],['The Jolly Judge','spicy','🍻','🌇🌙','Pub & Birre','Un pub piccolo e nascosto in un vicolo vicino alla Royal Mile. Entrate per una pinta e restate un po’.'],['Braw Brunch','mild','🥞','🌅☀️','Cibo','Fermatevi per una colazione o un brunch sostanzioso.'],['Dean Village','mild','🏘️','☀️','Passeggiate','Un piccolo villaggio da cartolina in mezzo a Edimburgo. Fateci un giro lungo il fiume.'],['Princes Street Gardens','mild','🌷','☀️🌇','Parchi','Il parco proprio sotto il castello. Se c’è bel tempo, fermatevi un po’ sull’erba.'],['Floral Clock','mild','💐','☀️','Monumenti','Un orologio fatto di fiori nei Princes Street Gardens. La fioritura è stagionale.'],['M&S','mild','🧺','🌅☀️🌙','Supermercati','La roba è super buona, ma costa un po’.'],['Blackwell’s','mild','📚','🌅☀️','Librerie','Entrate anche solo per curiosare. È molto più grande di quanto sembri da fuori.'],['Black Medicine Coffee','mild','🍵','🌅☀️','Caffè','Il cartello fuori dice che Harry Potter non è stato scritto qui. Prendetevi un matcha latte.'],['Portobello Beach','spicy','🏖️','☀️🌇','Passeggiate','Sì, Edimburgo ha anche una spiaggia. Non aspettatevi il Mediterraneo. Vi mangiate un panino col pesce e tornate indietro.'],['Cables Wynd House (Banana Flats)','spicy','🏢','☀️','Curiosità','Il palazzone brutalista di Leith legato a Trainspotting. Guardatelo da fuori: ci abitano persone.'],['Greyfriars Kirkyard','spicy','🪦','🌅☀️','Curiosità','Un cimitero pieno di storie. Cercate la tomba di Thomas Riddell, legata alla leggenda del nome Voldemort.'],['Greyfriars Bobby','mild','🐕','🌅☀️','Monumenti','La statua del cane più famoso di Edimburgo. Evitate di strofinargli il naso.'],['Royal Mile','mild','🏰','🌅☀️🌙','Passeggiate','La strada più famosa del centro storico. Percorretela senza fretta.'],['Victoria Street','mild','🌈','🌅☀️','Passeggiate','La strada curva e colorata che avrete visto in mille foto.'],['Grassmarket','mild','🏙️','☀️🌙','Passeggiate','Una piazza piena di pub, proprio sotto il castello.'],['Edinburgh Castle','mild','🏯','🌅☀️','Monumenti','Da fuori è già spettacolare. Per entrare controllate prezzi e biglietti.'],['George Square','mild','🎓','🌅☀️','Passeggiate','Una delle zone universitarie della città.'],['Frankenstein Bar','mild','🧟','☀️🌙','Pub & Birre','Un pub a tema Frankenstein in una ex chiesa.'],['Scottish National Gallery','mild','🖼️','🌅☀️','Musei','Una galleria d’arte in pieno centro, con collezione permanente gratuita.'],['Makars Mash Bar','mild','🥔','☀️🌙','Cibo','Andate direttamente a chiedere il primo tavolo libero. Nella mia esperienza ve ne assegnano uno entro un paio d’ore.'],['Castle Café','mild','🍳','🌅','Cibo','Se cercate una Full Scottish Breakfast, è una delle opzioni da considerare.'],['Sainsbury’s','mild','🛍️','🌅☀️🌙','Supermercati','Anche qui cercate il Meal Deal: main, snack e drink tra quelli inclusi.'],['Lidl','spicy','🛒','🌅☀️🌙','Supermercati','Se fate la spesa, usate la Lidl Plus.'],['Union Social Garden','spicy','🍺','☀️🌙','Pub & Birre','Un beer garden vicino all’Informatics Forum. Controllate se è aperto.'],['The Elephant House','mild','🧈','☀️','Caffè','Andateci solo per la burrobirra (che a me fa schifo, è soda con caramello).','Disponibilità della burrobirra da verificare.'],['Pizza Posto','extra','🍕','☀️🌙','Pizza','Pizza napoletana in centro.'],['Truck Blu','extra','🚚','☀️🌙','Pizza','Truck gestito da italiani, vicino a Piccolino. Pizza napoletana preparata al momento.'],['Stonehaven & Dunnottar Castle','extra','🏰','☀️','Fuori da Edimburgo','Un castello spettacolare sulle scogliere, a picco sul mare. Vale la gita, ma mettete in conto un bel po’ di strada.'],['The Bay Fish & Chips','extra','🐟','☀️','Fuori da Edimburgo','Se andate a Stonehaven, fermatevi qui per un fish & chips sul mare.'],['Tour delle Highlands — GetYourGuide','extra','🏔️','🌅☀️','Fuori da Edimburgo','Le Highlands sono bellissime. Un tour organizzato da Edimburgo? Ma boh.'],['Informatics Forum','personal','💻','','Ale’s Path','Dove andavo a lavorare']];
const places=raw.map((r,i)=>({id:i,name:r[0],type:r[1],emoji:r[2],time:r[3],category:r[4],description:r[5],warning:r[6]}));const aleNames=['Informatics Forum','The Meadows','Arthur’s Seat','Rockstar North','Mosque Kitchen','Pickleback','The Last Drop','National Museum of Scotland','Scott Monument','Bertie’s Proper Fish & Chips','Tesco','Scottish Parliament','Pepe’s Piri Piri','Calton Hill','The Jolly Judge','Braw Brunch','Dean Village','Princes Street Gardens','Floral Clock'];const ale=aleNames.map(n=>places.find(p=>p.name===n));let saved=[];try{saved=JSON.parse(localStorage.getItem('edinburgh-stars')||'[]')}catch{}let page='home',filter='Tutti',query='';const app=document.getElementById('app'),detail=document.getElementById('detail');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function star(p){return `<button class="star ${saved.includes(p.id)?'on':''}" aria-label="${saved.includes(p.id)?'Rimuovi':'Aggiungi'} ${esc(p.name)} dai preferiti" onclick="toggle(${p.id})">${saved.includes(p.id)?'★':'☆'}</button>`}function card(p){return `<article class="card"><div class="thumb">${p.emoji}</div><button class="cardmain" onclick="openPlace(${p.id})"><strong>${esc(p.name)}</strong><small>${p.type==='mild'?'🌿 Mild':p.type==='spicy'?'🌶️ Spicy':'📍 '+esc(p.category)} ${p.time}</small></button>${star(p)}</article>`}function cards(a){return a.length?`<div class="cards">${a.map(card).join('')}</div>`:'<div class="empty">Qui ancora niente. ⭐</div>'}function mix(a){let m=a.filter(p=>p.type==='mild').length,s=a.filter(p=>p.type==='spicy').length,t=m+s,mp=t?Math.round(m/t*100):0;return `<div class="mix"><div class="row"><b>YOUR EDINBURGH MIX</b><span>🌿🌶️</span></div><div class="stats"><div class="stat">🌿 Mildness<strong>${mp}%</strong></div><div class="stat sp">🌶️ Spiciness<strong>${t?100-mp:0}%</strong></div></div><div class="bar"><div style="width:${mp}%"></div></div><p style="font-size:12px;color:#cbd7ce">${t} tappe Mild/Spicy nel mix</p></div>`}function nav(){document.getElementById('nav').innerHTML=[['home','⌂','Home'],['explore','⌕','Esplora'],['favorites','☆','Preferiti'],['ale','⌖','Ale’s Path']].map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><b>${ico}</b>${label}</button>`).join('')}function go(p){page=p;filter='Tutti';query='';render();window.scrollTo(0,0)}function section(p,title){page=p;filter=title;query='';render();window.scrollTo(0,0)}function render(){nav();if(page==='home'){app.innerHTML=`<div class="hero-grid"><button class="hero" onclick="section('explore','Mild')">🌿<strong>Mild</strong><span>Classici, passeggiate e posti tranquilli. ↗</span></button><button class="hero spicy" onclick="section('explore','Spicy')">🌶️<strong>Spicy</strong><span>Posti strani, cibo e qualche deviazione. ↗</span></button></div><button class="strip" onclick="go('ale')"><strong>📍 Ale’s Path →</strong><small>Quello che farei io, se fossi lì.</small></button><h2 class="section-title">Le altre cose</h2><div class="extras"><button class="extra" onclick="section('explore','Pizza')">🍕 Pizza, anche se weird<small>Due opzioni, zero giudizi</small></button><button class="extra" onclick="section('explore','Fuori da Edimburgo')">🏔️ Fuori da Edimburgo<small>Gite e idee</small></button><button class="extra" onclick="page='loyalty';render()">💳 Loyalty Cards<small>QR e codici a portata di mano</small></button><button class="extra" onclick="page='notes';render()">⚠️ Survival Notes<small>Consigli prima di partire</small></button></div><h2 class="section-title">Qualche idea</h2>${cards([places[1],places[6],places[12],places[13]])}`}else if(page==='explore'){let options=['Tutti','Mild','Spicy','Cibo','Pub & Birre','Passeggiate','Musei','Supermercati','Librerie','Caffè','Pizza','Fuori da Edimburgo'];let a=places.filter(p=>p.type!=='personal'&&(filter==='Tutti'||(filter==='Mild'&&p.type==='mild')||(filter==='Spicy'&&p.type==='spicy')||p.category===filter)).filter(p=>(p.name+' '+p.category+' '+p.description).toLowerCase().includes(query.toLowerCase()));app.innerHTML=`<h2 class="section-title">Esplora</h2><input class="search" placeholder="Cerca un posto, una pizza, un pub…" aria-label="Cerca" value="${esc(query)}" oninput="query=this.value;updateResults()"><div class="toolbar">${options.map(o=>`<button class="chip ${filter===o?'active':''}" onclick="filter='${esc(o)}';render()">${esc(o)}</button>`).join('')}</div><div id="results">${cards(a)}</div>`}else if(page==='favorites'){let a=places.filter(p=>saved.includes(p.id));app.innerHTML=`<h2 class="section-title">⭐ Preferiti</h2><p>Il vostro giro, deciso da voi.</p>${mix(a)}${cards(a)}`}else if(page==='ale'){app.innerHTML=`<h2 class="section-title">📍 Ale’s Path</h2><p>Quello che farei io, se fossi lì. La selezione è fissa; voi potete comunque salvarvi i posti con la stellina.</p>${mix(ale)}${cards(ale)}`}else if(page==='loyalty'){app.innerHTML=`<h2 class="section-title">💳 Loyalty Cards</h2><p>Le tessere non sono incluse in questa versione pubblica. Fatevele condividere in privato.</p>`}else if(page==='notes'){app.innerHTML=`<h2 class="section-title">⚠️ Survival Notes</h2><div class="notice">🌬️ <b>Vento e pioggia.</b> Ad Arthur’s Seat servono scarpe decenti; con terreno bagnato fate attenzione.</div><div class="notice">🥪 <b>Meal Deal.</b> Da Tesco e Sainsbury’s scegliete un main, uno snack e una bevanda tra i prodotti inclusi nella promozione.</div><div class="notice">🐕 <b>Greyfriars Bobby.</b> Il naso lucido non è un invito a strofinarlo.</div><div class="notice">🥔 <b>Makars.</b> Provate a chiedere direttamente un tavolo: potrebbe esserci da aspettare.</div><div class="notice">🗼 <b>Scott Monument.</b> I gradini per salire sono stretti.</div>`}else{page='home';render()} }function updateResults(){let a=places.filter(p=>p.type!=='personal'&&(filter==='Tutti'||(filter==='Mild'&&p.type==='mild')||(filter==='Spicy'&&p.type==='spicy')||p.category===filter)).filter(p=>(p.name+' '+p.category+' '+p.description).toLowerCase().includes(query.toLowerCase()));document.getElementById('results').innerHTML=cards(a)}function toggle(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('edinburgh-stars',JSON.stringify(saved));render()}function openPlace(id){let p=places[id];detail.innerHTML=`<div class="detailhero">${p.emoji}</div><div class="detailbody"><button class="back" onclick="closePlace()">← Indietro</button><div class="row"><small>${p.type==='mild'?'🌿 MILD':p.type==='spicy'?'🌶️ SPICY':esc(p.category)} · ${p.time}</small>${star(p)}</div><h1 style="color:#293b30;font-size:33px">${esc(p.name)}</h1><p style="font-size:17px;line-height:1.55">${esc(p.description)}</p>${p.warning?`<div class="notice">⚠️ ${esc(p.warning)}</div>`:''}<a class="maps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' Edinburgh Scotland')}">↗ Apri su Google Maps</a><p class="photo-disclaimer">Le fotografie dei luoghi saranno inserite nella prossima versione.</p></div>`;detail.classList.remove('hidden');document.body.style.overflow='hidden'}function closePlace(){detail.classList.add('hidden');document.body.style.overflow='';render()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlace()});render();
</script></body></html>
